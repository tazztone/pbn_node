<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBN Quality Pipeline Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #e1e1e6;
            --text-dim: #a1a1aa;
            --accent: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
            line-height: 1.6;
        }

        .container { max-width: 1600px; margin: 0 auto; }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 { margin: 0; font-size: 2.5rem; letter-spacing: -0.02em; }
        .timestamp { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 16px;
            margin-top: -16px;
        }

        th {
            text-align: left;
            padding: 12px 24px;
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        tr { background: var(--card-bg); border-radius: 12px; }

        td {
            padding: 24px;
            vertical-align: top;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }

        .scenario-cell { width: auto; min-width: 250px; }
        .scenario-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .scenario-name { font-size: 1.25rem; font-weight: 600; color: #fff; }
        .scenario-meta { font-size: 0.85rem; color: var(--text-dim); }

        .status-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }
        .status-ok .status-badge { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-warn .status-badge { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

        .img-cell { width: auto; min-width: 300px; }
        img {
            width: 100%;
            height: auto;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: block;
            cursor: zoom-in;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        img.zoom {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2);
            z-index: 1000;
            width: auto;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            cursor: zoom-out;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-width: 800px;
        }

        .img-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .img-container label {
            font-size: 0.65rem;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            min-width: 300px;
        }

        .metric-card {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .metric-card.warn { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }

        .metric-card label {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .metric-card value {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .critique-cell {
            max-width: 400px;
            font-size: 0.9rem;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            background: rgba(0,0,0,0.2);
        }

        .critique-content {
            white-space: pre-wrap;
        }

        .critique-empty { font-style: italic; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>PBN Quality Pipeline Audit</h1>
            </div>
            <div class="timestamp">Generated: $timestamp</div>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 280px;">Scenario Analysis</th>
                    <th>Side-by-Side Comparison (Click to Zoom)</th>
                    $llm_header
                </tr>
            </thead>
            <tbody>
                $rows
            </tbody>
        </table>
    </div>
</body>
</html>
